services:
  db:
    image: postgres:16
    container_name: rms-postgres
    environment:
      POSTGRES_DB: rms
      POSTGRES_USER: rms
      POSTGRES_PASSWORD: rms
    ports:
      - "5432:5432"
    volumes:
      - rms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms -d rms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rms-pgdata:
