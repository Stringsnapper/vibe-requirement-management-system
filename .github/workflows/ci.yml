name: CI

# CI-1 (see CI-PLAN.md §4–§5, §11): build, run tests (H2 in-memory — no external Postgres
# needed today), enforce ktlint and JaCoCo coverage floors (all wired into `./gradlew build`
# via the `check` task), and lint commit messages for Conventional Commits. Security scans
# (CodeQL, Trivy, dependency review) arrive in CI-2.

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# Cancel superseded runs on the same branch/PR to save minutes (CI-PLAN.md §9).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs elevate only where needed.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint & coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # publish the JUnit check run
      pull-requests: write    # annotate the PR with test results
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs tests, ktlintCheck and jacocoTestCoverageVerification via `check`.
      - name: Build, test, lint & verify coverage
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}
        with:
          report_paths: build/test-results/test/*.xml
          check_name: Test results
          fail_on_failure: false   # the gradlew step already fails the job on test failure

      - name: Upload test, coverage & lint reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
            build/reports/ktlint/
          retention-days: 14
          if-no-files-found: ignore

  commitlint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout (full history for the commit range)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint PR commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
