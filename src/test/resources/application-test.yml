# Test profile: in-memory H2 in PostgreSQL-compatibility mode, schema from JPA, no Flyway.
spring:
  datasource:
    url: jdbc:h2:mem:rms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
