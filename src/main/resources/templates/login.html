<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in — RMS')}"></head>
<body>
<main class="card login-card">
    <h1>Sign in</h1>
    <p th:if="${param.error}" class="error">Invalid username or password.</p>
    <p th:if="${param.logout}" class="info">You have been signed out.</p>
    <form th:action="@{/login}" method="post">
        <label>Username
            <input type="text" name="username" autofocus required/>
        </label>
        <label>Password
            <input type="password" name="password" required/>
        </label>
        <button type="submit">Sign in</button>
    </form>
    <p class="hint">Default credentials on first boot: <code>admin</code> / <code>admin</code>.</p>
</main>
</body>
</html>
